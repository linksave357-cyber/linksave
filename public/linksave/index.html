<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=https://linksaves.com/" />
    <script>
      var cleanPath = window.location.pathname.replace(/^\/linksave\/?/, '/') + window.location.search + window.location.hash;
      window.location.replace('https://linksaves.com' + (cleanPath.startsWith('/') ? cleanPath : '/' + cleanPath));
    </script>
    <link rel="canonical" href="https://linksaves.com/" />
    <title>Redirecting to LinkSave...</title>
  </head>
  <body>
    <p>Redirecting to <a href="https://linksaves.com/">https://linksaves.com/</a>...</p>
  </body>
</html>
